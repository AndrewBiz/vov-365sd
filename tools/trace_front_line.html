<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обводка линии фронта по листу Lage Ost</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; background: #111; color: #eee;
         display: flex; flex-direction: column; }
  header { padding: 6px 10px; background: #1c1c1c; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, input { font: inherit; padding: 3px 7px; }
  input[type=number] { width: 86px; }
  input[type=text] { width: 108px; }
  #viewport { position: relative; overflow: hidden; flex: 1 1 auto; min-height: 200px; background: #000; cursor: crosshair; }
  #viewport.dragging { cursor: grabbing; }
  #viewport.drawing { cursor: crosshair; }
  canvas { display: block; }
  header span { color: #ccc; }
  #calList { font-size: 12px; color: #fb0; padding: 2px 10px 0; max-height: 40px; overflow: auto; flex: 0 0 auto; }
  #status { padding: 2px 10px 6px; color: #9ad; font-size: 12px; }
  #counters { color: #8f8; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <input type="file" id="file" accept="image/*">
  <span>Калибровка:</span>
  <input type="text" id="calName" placeholder="название (Клин)">
  <input type="number" id="calLon" step="0.001" placeholder="долгота">
  <input type="number" id="calLat" step="0.001" placeholder="широта">
  <button id="calAdd">добавить точку</button>
  <button id="calClear">сбросить калибровку</button>
  <button id="undo">убрать штрих</button>
  <button id="clearLine">стереть линию</button>
  <button id="export">выгрузить JSON</button>
  <label style="color:#ccc">загрузить JSON<input type="file" id="load" accept="application/json" style="width:0;height:0;opacity:0;position:absolute"></label>
  <span>масштаб:</span>
  <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
  <button id="fit">вписать</button>
</header>
<div id="calList">калибровочных точек нет</div>
<div id="flash" style="color:#6cf;font-size:12px;padding:0 10px;min-height:16px"></div>
<div id="viewport"><canvas id="cv"></canvas></div>
<div id="status">
  <b>рисование</b>: зажми левую кнопку и веди по линии фронта (одна протяжка = один штрих) ·
  <b>панорама</b>: правая кнопка или <kbd>пробел</kbd>+протяжка · <b>масштаб</b>: колесо к курсору ·
  <kbd>0</kbd> вписать · <span id="counters"></span>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const viewport = document.getElementById('viewport');

let img = null;
let zoom = 1;
let viewX = 0, viewY = 0;
const strokes = [];         // штрихи: массив массивов точек в пикселях изображения
const calib = [];           // {x, y, lon, lat, label}
let pending = null;
let drag = null;
let spaceDown = false;

function imageToScreen(p) { return [(p.x - viewX) * zoom, (p.y - viewY) * zoom]; }
function screenToImage(sx, sy) { return { x: sx / zoom + viewX, y: sy / zoom + viewY }; }
function allPoints() { return strokes.reduce((acc, s) => acc.concat(s), []); }

function clampView() {
  if (!img) return;
  const w = cv.width / zoom, h = cv.height / zoom;
  viewX = Math.max(-w * 0.2, Math.min(img.width - w * 0.8, viewX));
  viewY = Math.max(-h * 0.2, Math.min(img.height - h * 0.8, viewY));
}

function zoomAt(sx, sy, factor) {
  const before = screenToImage(sx, sy);
  zoom = Math.min(24, Math.max(0.02, zoom * factor));
  viewX = before.x - sx / zoom;
  viewY = before.y - sy / zoom;
  clampView();
}

function fit() {
  if (!img) return;
  zoom = Math.min(cv.width / img.width, cv.height / img.height);
  viewX = (img.width - cv.width / zoom) / 2;
  viewY = (img.height - cv.height / zoom) / 2;
  draw();
}

function resize() {
  const rect = viewport.getBoundingClientRect();
  cv.width = Math.max(320, Math.floor(rect.width));
  cv.height = Math.max(240, Math.floor(rect.height));
  if (img) clampView();
  draw();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(viewport);

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!img) { updateLabels(); return; }

  const sw = cv.width / zoom, sh = cv.height / zoom;
  const sx = Math.max(0, viewX), sy = Math.max(0, viewY);
  const ex = Math.min(img.width, viewX + sw), ey = Math.min(img.height, viewY + sh);
  if (ex > sx && ey > sy) {
    ctx.imageSmoothingEnabled = zoom < 3;
    ctx.drawImage(img, sx, sy, ex - sx, ey - sy,
                  (sx - viewX) * zoom, (sy - viewY) * zoom, (ex - sx) * zoom, (ey - sy) * zoom);
  }

  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ff2d2d';
  strokes.forEach(stroke => {
    if (stroke.length === 1) {
      const [x, y] = imageToScreen(stroke[0]);
      ctx.fillStyle = '#ff2d2d';
      ctx.fillRect(x - 2, y - 2, 4, 4);
      return;
    }
    ctx.beginPath();
    stroke.forEach((p, i) => {
      const [x, y] = imageToScreen(p);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  });

  ctx.strokeStyle = '#ffaa00';
  ctx.fillStyle = '#ffaa00';
  calib.forEach((c, i) => {
    const [x, y] = imageToScreen(c);
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillText(String(i + 1), x + 10, y - 10);
  });

  updateLabels();
}

function flash(msg) { document.getElementById('flash').textContent = msg; }

function updateLabels() {
  document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  document.getElementById('calList').textContent = calib.length
    ? 'точки: ' + calib.map((c, i) => `${i + 1}.${c.label || '?'} (${c.lon}, ${c.lat})`).join(' · ')
    : 'калибровочных точек нет';
  document.getElementById('counters').textContent =
    `точки линии: ${allPoints().length} в ${strokes.length} штрих(ах) · калибровка: ${calib.length}`;
}

document.getElementById('file').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => { img = im; resize(); fit(); };
  im.src = URL.createObjectURL(f);
};

viewport.addEventListener('wheel', ev => {
  if (!img) return;
  ev.preventDefault();
  const rect = cv.getBoundingClientRect();
  zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, ev.deltaY < 0 ? 1.25 : 1 / 1.25);
  draw();
}, { passive: false });

viewport.addEventListener('mousedown', ev => {
  if (!img) return;
  const rect = cv.getBoundingClientRect();
  const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
  const pan = ev.button === 1 || ev.button === 2 || spaceDown;
  if (pan) {
    drag = { sx, sy, viewX, viewY, moved: 0, mode: 'pan' };
    viewport.classList.add('dragging');
    ev.preventDefault();
    return;
  }
  if (ev.button !== 0) return;
  const p = screenToImage(sx, sy);
  if (pending) {
    calib.push({ x: p.x, y: p.y, lon: pending.lon, lat: pending.lat, label: pending.label });
    pending = null;
    draw();
    return;
  }
  drag = { sx, sy, moved: 0, mode: 'draw', stroke: [p], last: [sx, sy] };
  strokes.push(drag.stroke);
  viewport.classList.add('drawing');
  draw();
});

viewport.addEventListener('mousemove', ev => {
  if (!drag) return;
  const rect = cv.getBoundingClientRect();
  const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
  if (drag.mode === 'pan') {
    const dx = sx - drag.sx, dy = sy - drag.sy;
    viewX = drag.viewX - dx / zoom;
    viewY = drag.viewY - dy / zoom;
    clampView();
    draw();
    return;
  }
  // рисование: точка добавляется не чаще, чем через 3 экранных пикселя
  if (Math.hypot(sx - drag.last[0], sy - drag.last[1]) < 3) return;
  drag.last = [sx, sy];
  drag.stroke.push(screenToImage(sx, sy));
  draw();
});

viewport.addEventListener('mouseup', () => {
  if (drag && drag.mode === 'draw' && drag.stroke.length < 2) {
    // одиночный клик — точка-«кирпичик», оставляем как есть
  }
  drag = null;
  viewport.classList.remove('dragging', 'drawing');
});

viewport.addEventListener('contextmenu', ev => ev.preventDefault());
viewport.addEventListener('auxclick', ev => ev.preventDefault());

window.addEventListener('keydown', ev => {
  if (ev.code === 'Space') { spaceDown = true; ev.preventDefault(); }
  if (ev.key === '0') fit();
  if (ev.key === '+' || ev.key === '=') { zoomAt(cv.width / 2, cv.height / 2, 1.25); draw(); }
  if (ev.key === '-') { zoomAt(cv.width / 2, cv.height / 2, 1 / 1.25); draw(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z') { strokes.pop(); draw(); }
});
window.addEventListener('keyup', ev => { if (ev.code === 'Space') spaceDown = false; });

document.getElementById('zoomIn').onclick = () => { zoomAt(cv.width / 2, cv.height / 2, 1.25); draw(); };
document.getElementById('zoomOut').onclick = () => { zoomAt(cv.width / 2, cv.height / 2, 1 / 1.25); draw(); };
document.getElementById('fit').onclick = fit;

document.getElementById('calAdd').onclick = () => {
  const lon = parseFloat(document.getElementById('calLon').value);
  const lat = parseFloat(document.getElementById('calLat').value);
  if (!isFinite(lon) || !isFinite(lat)) { flash('введи долготу и широту'); return; }
  pending = { lon, lat, label: document.getElementById('calName').value.trim() };
  flash(`кликни по точке «${pending.label || 'без названия'}» на карте (масштаб — колесом, панорама — правой кнопкой)`);
};
document.getElementById('calClear').onclick = () => { calib.length = 0; draw(); };
document.getElementById('undo').onclick = () => { strokes.pop(); draw(); };
document.getElementById('clearLine').onclick = () => { strokes.length = 0; draw(); };

document.getElementById('export').onclick = () => {
  const data = {
    pixels: allPoints(),
    calibration_points: calib,
    strokes: strokes.length,
    image_size: img ? [img.width, img.height] : null,
    zoom_at_export: zoom,
    note: calib.length >= 3
      ? 'аффинная подгонка по ' + calib.length + ' точкам'
      : (calib.length === 2 ? 'подобие по двум точкам' : 'калибровки недостаточно')
  };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'front-line-pixels.json';
  a.click();
};

document.getElementById('load').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const data = JSON.parse(reader.result);
    calib.length = 0;
    (data.calibration_points || []).forEach(c => calib.push(c));
    if (!calib.length && data.calibration) {
      ['A', 'B'].forEach(k => { if (data.calibration[k]) calib.push(data.calibration[k]); });
    }
    strokes.length = 0;
    if (Array.isArray(data.pixels) && data.pixels.length) strokes.push(data.pixels.slice());
    draw();
    flash(`загружено: калибровочных точек ${calib.length}, точек линии ${allPoints().length}`);
  };
  reader.readAsText(f);
};

resize();
</script>
</body>
</html>
